name: Päivitä ottelut

on:
  schedule:
    # Ajat ovat UTC-aikaa: Suomen aika miinus 3 tuntia kesällä, miinus 2 talvella.
    #
    # Aamulla: yön aikana tehdyt ottelusiirrot ja tuore päivänäkymä.
    - cron: "0 3 * * *"
    # Illalla: päivän pelit siirtyvät pelattuihin ja kalenteri pysyy ajan tasalla.
    - cron: "0 18 * * *"
  workflow_dispatch: # sallii päivityksen käsin GitHubin Actions-välilehdeltä
  push:
    branches: [main]

permissions:
  contents: write  # robotti tallentaa rakennetun sivun repoon
  pages: write     # julkaisu GitHub Pagesiin
  id-token: write  # julkaisun tunnistautuminen

# Vain yksi ajo kerrallaan. Uusi ajo odottaa edellisen valmistumista, joten
# päällekkäiset julkaisut eivät enää törmää toisiinsa.
concurrency:
  group: paivita
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    outputs:
      maara: ${{ steps.huomautukset.outputs.maara }}
      teksti: ${{ steps.huomautukset.outputs.teksti }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Hae ottelut ja rakenna sivu
        run: node hae.js

      # Kerää virheet tulokset.txt-, poissa.txt-, lisapelit.txt- ja striimit.txt-
      # tiedostoista. Ne näytetään vasta julkaisun jälkeen (vaihe tarkista).
      - name: Kerää huomautukset
        id: huomautukset
        run: |
          {
            echo "maara=$(grep -c . varoitukset.txt || true)"
            echo "teksti<<LOPPU_VAROITUKSET"
            cat varoitukset.txt
            echo "LOPPU_VAROITUKSET"
          } >> "$GITHUB_OUTPUT"

      - name: Tallenna muutokset
        run: |
          git config user.name "Ottelurobotti"
          git config user.email "actions@github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Päivitetyt ottelutiedot"
            git push
          fi

      - name: Paketoi sivu julkaistavaksi
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  # Sivu julkaistaan tästä työnkulusta, ei enää jokaisesta commitista erikseen.
  # Vaatii asetuksen Settings → Pages → Source: GitHub Actions.
  julkaise:
    needs: paivita
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - name: Julkaise GitHub Pagesiin
        id: julkaisu
        uses: actions/deploy-pages@v4

  # Sivu on jo julkaistu. Jos käsin ylläpidetyissä tiedostoissa on rivejä, joita
  # ei ymmärretty tai jotka eivät osuneet mihinkään peliin, ajo muuttuu tässä
  # punaiseksi ja virheet näkyvät ajon yhteenvedossa.
  tarkista:
    needs: [paivita, julkaise]
    runs-on: ubuntu-latest
    steps:
      - name: Tarkista tulokset, poissaolot, lisäpelit ja striimit
        env:
          MAARA: ${{ needs.paivita.outputs.maara }}
          TEKSTI: ${{ needs.paivita.outputs.teksti }}
        run: |
          if [ "${MAARA:-0}" -eq 0 ]; then
            echo "Kaikki rivit kunnossa."
            exit 0
          fi
          echo "$TEKSTI" | while IFS= read -r rivi; do
            [ -n "$rivi" ] && echo "::error title=Korjaa rivi::$rivi"
          done
          echo "Sivu on julkaistu, mutta yllä olevat rivit jäivät huomiotta. Korjaa ne ja tallenna uudelleen."
          exit 1
