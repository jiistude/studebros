name: Päivitä ottelut

on:
  schedule:
    # Ajat ovat UTC-aikaa: Suomen aika miinus 3 tuntia kesällä, miinus 2 talvella.
    #
    # Aamulla: yön aikana tehdyt ottelusiirrot ja tuore päivänäkymä.
    - cron: "0 3 * * *"
    # Illalla: päivän pelit siirtyvät pelattuihin ja kalenteri pysyy ajan tasalla.
    - cron: "0 18 * * *"
  workflow_dispatch: # sallii päivityksen käsin GitHubin Actions-välilehdeltä
  push:
    branches: [main]

permissions:
  contents: write  # robotti tallentaa rakennetun sivun repoon
  pages: write     # julkaisu GitHub Pagesiin
  id-token: write  # julkaisun tunnistautuminen

# Vain yksi ajo kerrallaan. Uusi ajo odottaa edellisen valmistumista, joten
# päällekkäiset julkaisut eivät enää törmää toisiinsa.
concurrency:
  group: paivita
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Hae ottelut ja rakenna sivu
        run: node hae.js

      - name: Tallenna muutokset
        run: |
          git config user.name "Ottelurobotti"
          git config user.email "actions@github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Päivitetyt ottelutiedot"
            git push
          fi

      - name: Paketoi sivu julkaistavaksi
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  # Sivu julkaistaan tästä työnkulusta, ei enää jokaisesta commitista erikseen.
  # Vaatii asetuksen Settings → Pages → Source: GitHub Actions.
  julkaise:
    needs: paivita
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - name: Julkaise GitHub Pagesiin
        id: julkaisu
        uses: actions/deploy-pages@v4
