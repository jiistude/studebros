name: Päivitä ottelut

on:
  schedule:
    # Ajat ovat UTC-aikaa: Suomen aika miinus 3 tuntia kesällä, miinus 2 talvella.
    #
    # 1) Perusrytmi: maanantaiaamuisin. Poimii viikon aikana tehdyt ottelusiirrot.
    - cron: "0 4 * * 1"
    # 2) Viikonlopun iltoina: tuoreet tulokset näkyvät sivulla jo saman illan aikana.
    - cron: "0 18 * * 6,0"
    # 3) Helmi-toukokuu: joka päivä, koska jatkosarjojen ja pudotuspelien
    #    aikataulut varmistuvat lyhyellä varoitusajalla.
    - cron: "0 4 * 2-5 *"
  workflow_dispatch: # sallii päivityksen käsin GitHubin Actions-välilehdeltä
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: paivita
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Hae ottelut ja rakenna sivu
        run: node hae.js

      - name: Tallenna muutokset
        run: |
          git config user.name "Ottelurobotti"
          git config user.email "actions@github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Päivitetyt ottelutiedot"
            git push
          fi
